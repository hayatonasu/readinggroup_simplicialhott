site_name: Simplicial HoTT reading group

plugins:
  - rzk

theme:
  name: material
  palette:
    - scheme: default        # light
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate          # dark
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

nav:
  - Home: index.md 
  - Rzk:
    - Test: rzk/test.rzk.md
    - GitHub: https://github.com/hayatonasu/readinggroup_simplicialhott

extra_javascript:
  - javascript/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
