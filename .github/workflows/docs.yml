name: Build and deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mkdocs-plugin-rzk pygments-rzk

      - name: Install rzk
        env:
          RZK_VERSION: v0.11.3
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rzk-lang/rzk/releases/download/${RZK_VERSION}/rzk-${RZK_VERSION}-Linux-X64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" rzk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rzk" version

      - name: Build site
        run: mkdocs build 

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
